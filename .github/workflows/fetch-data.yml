name: fetch-data

on:
  push:
    branches: [main]
    paths:
      - "scripts/*.py"
      - ".github/workflows/fetch-data.yml"
  schedule:
    - cron: "17 22 * * 1-5"   # 평일 22:17 UTC (미국장 마감 후, 한국 아침 7:17)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet yfinance pandas numpy requests
      - name: Fetch
        run: python scripts/fetch_data.py
      - name: Build page data
        run: |
          python scripts/static_data.py
          python scripts/build_site_data.py
      - name: Commit data
        run: |
          # 커밋 작성자는 저장소 주인(마지막 사람 커밋의 작성자)과 같게 둔다
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          git add data
          if git diff --cached --quiet; then
            echo "no data change"
          else
            git commit -m "data: 자동 갱신 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
